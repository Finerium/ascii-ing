<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Iris</title>
  <meta name="description" content="Iris — a terminal lyric film, replayed in the browser." />
  <meta name="color-scheme" content="dark" />
  <!-- Tiny inline favicon (a warm dot on Kimbie brown) so the console stays
       clean — no /favicon.ico 404. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23221a0f'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23d3af86'/%3E%3C/svg%3E" />

  <!--
    asciinema-player v3.8.0 (pinned), served from jsDelivr.
    Both URLs verified to return HTTP 200.
  -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/asciinema-player@3.8.0/dist/bundle/asciinema-player.css"
    crossorigin="anonymous"
  />

  <style>
    /* ------------------------------------------------------------------ *
     *  FONTS — self-hosted, so glyph coverage never depends on a CDN.
     *
     *  Required glyph set (from the cast / source):
     *    ·  middle dot            •  bullet              ✦ ✧  four-pointed stars
     *    ∗  asterisk operator     ⋆  star operator       *  ascii asterisk
     *    ∿  sine wave             ~  ascii tilde         ⌒  arc
     *    ◉  fisheye               ●  black circle        ◍  circle vertical fill
     *    ∴  therefore             ‿  undertie            ˚  ring above
     *    ▏  left one-eighth block ╴  box light left      ╶  box light right
     *    ‹ ›  angle quotes        —  em dash             é  e-acute
     *
     *  Coverage (verified with fontTools against the SHIPPED woff2 files):
     *    DejaVu Sans Mono  -> 22/23 (everything except ∿ U+223F)
     *    Noto Sans Math    -> supplies ∿ U+223F (+ a few safety glyphs)
     *  Union = 23/23, zero tofu.
     *
     *  DejaVu is a true monospace and carries the terminal look; the math
     *  fallback is scoped with unicode-range so the browser only pulls it
     *  for the handful of codepoints it actually owns.
     * ------------------------------------------------------------------ */
    @font-face {
      font-family: "DejaVu Sans Mono";
      font-style: normal;
      font-weight: 400;
      font-display: block; /* avoid a tofu flash before the glyph font loads */
      src: url("./fonts/DejaVuSansMono.woff2") format("woff2");
    }
    @font-face {
      /* REAL bold (identical 1233/2048 advance to the regular weight). The
         lyric is drawn bold; without this file the browser SYNTHESIZES bold,
         and Safari/WebKit's faux-bold is wider than the measured cell — that
         overflow clipped the lyric's last glyph(s) (Chrome's faux-bold is
         narrow enough to fit, which is why it only broke in Safari). */
      font-family: "DejaVu Sans Mono";
      font-style: normal;
      font-weight: 700;
      font-display: block;
      src: url("./fonts/DejaVuSansMono-Bold.woff2") format("woff2");
    }
    @font-face {
      font-family: "Iris Math Fallback";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("./fonts/NotoSansMath-subset.woff2") format("woff2");
      /* Only the glyphs this font is responsible for (notably ∿ U+223F). */
      unicode-range: U+002A, U+007E, U+2217, U+2234, U+223F, U+22C6,
                     U+2312, U+25C9, U+25CD, U+25CF;
    }

    :root {
      /* The exact Kimbie Dark background, used everywhere the terminal is
         transparent — confirmed from the official VS Code theme:
         extensions/theme-kimbie-dark -> editor.background. */
      --kimbie-bg: #221a0f;
      --kimbie-fg: #d3af86; /* Kimbie Dark editor.foreground */
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      /* Page background === terminal background, so the player melts into the
         page and the warm dark-brown is unbroken edge to edge. Never black. */
      background-color: var(--kimbie-bg);
      color: var(--kimbie-fg);
      /* Full-bleed: the animation fills the WHOLE browser viewport (web
         "fullscreen", not OS fullscreen). No padding, no chrome. */
      width: 100vw;
      height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* #stage gets a DEFINITE width (the full viewport); fit:"width" makes the
       110-col terminal fill that width, so the centered lyric is always fully
       visible and the whole thing scales with the window. Height is auto (the
       terminal's own), and <body> centers the band vertically — any extra space
       is invisible Kimbie. (Crucially: do NOT put grid/place-items on #stage —
       as the asciinema mount, that collapses its flex wrapper to width 0 and
       the terminal overflows/clips on the right. Centering belongs on <body>.) */
    #stage { width: 100vw; }

    /* asciinema-player paints its own background on .asciinema-player; make it
       transparent so OUR Kimbie body shows through around rounded corners. */
    #stage .ap-player,
    #stage .asciinema-player {
      background: transparent !important;
    }

    /* NO video chrome: hide asciinema's control bar AND its default
       start-overlay play-triangle. We supply our own quiet start cue. */
    #stage .ap-control-bar,
    #stage .ap-overlay-start { display: none !important; }

    /* Our own click-to-start / replay overlay — covers the whole viewport,
       transparent (the starfield poster shows through), with one faint,
       gently breathing cue. Nothing that reads as a "video". */
    #start-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 5;
      background: transparent;
      transition: opacity 0.6s ease;
    }
    #start-overlay.gone { opacity: 0; pointer-events: none; }
    #start-overlay .cue {
      font: 13px/1.5 "DejaVu Sans Mono", ui-monospace, monospace;
      letter-spacing: 0.28em;
      text-transform: lowercase;
      color: var(--kimbie-fg);
      padding: 0.7em 1.2em;
      animation: cue-breathe 3.2s ease-in-out infinite;
      user-select: none;
    }
    @keyframes cue-breathe {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 0.68; }
    }

    /* ------------------------------------------------------------------ *
     *  CUSTOM TERMINAL THEME: "kimbie"
     *
     *  asciinema-player reads these CSS custom properties from the element
     *  carrying the class `asciinema-player-theme-<name>`; we pass
     *  theme:"kimbie" so this block is the source of truth.
     *
     *  --term-color-background is THE important one: the cast paints every
     *  cell with a transparent (default) background (ESC[49m), so this value
     *  is what shows through behind every glyph — i.e. the whole field.
     * ------------------------------------------------------------------ */
    .asciinema-player-theme-kimbie {
      --term-color-background: #221a0f; /* Kimbie Dark editor.background */
      --term-color-foreground: #d3af86; /* Kimbie Dark editor.foreground */

      /* 16-color ANSI palette — warm, Kimbie-aligned. The recording is
         24-bit truecolor for ~99% of cells, so these are only a graceful
         floor for any default-palette cell. */
      --term-color-0:  #423929; /* black   (warm brown-black) */
      --term-color-1:  #dc3958; /* red     (Kimbie rose-red)  */
      --term-color-2:  #889b4a; /* green   (Kimbie olive)     */
      --term-color-3:  #f06431; /* yellow  (Kimbie orange)    */
      --term-color-4:  #8ab1b0; /* blue    (Kimbie teal)      */
      --term-color-5:  #98676a; /* magenta (Kimbie mauve)     */
      --term-color-6:  #7e602c; /* cyan    (Kimbie bronze)    */
      --term-color-7:  #d3af86; /* white   (Kimbie foreground)*/
      --term-color-8:  #7e602c; /* bright black  */
      --term-color-9:  #dc3958; /* bright red    */
      --term-color-10: #889b4a; /* bright green  */
      --term-color-11: #f79a32; /* bright yellow */
      --term-color-12: #8ab1b0; /* bright blue   */
      --term-color-13: #c1a78e; /* bright magenta*/
      --term-color-14: #a09f93; /* bright cyan   */
      --term-color-15: #f4f0e6; /* bright white  */
    }

    /* Use the REAL shipped bold above; NEVER synthesize faux-bold. Safari's
       synthetic bold renders wider than the cell asciinema measured (from the
       regular weight), so the bold lyric overflowed and its last glyph(s) were
       clipped by `.ap-line { overflow: hidden }`. Real DejaVu Bold has an
       identical advance width, so the grid stays exact and the line fits. */
    pre.ap-terminal { font-synthesis: none; }

    /* A quiet, centered fallback message if everything fails to load. */
    #fallback-note {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      margin: 0;
      font: 12px/1.4 "DejaVu Sans Mono", ui-monospace, monospace;
      color: #6f5d40;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      text-align: center;
    }
    #fallback-note.show { opacity: 1; }

    /* Honor reduced-motion: nothing autoplays anyway (click-to-start), so
       there is no motion until the user opts in. */
  </style>
</head>
<body>
  <main id="stage" aria-label="Iris — terminal lyric film"></main>
  <div id="start-overlay"><span class="cue">click to begin</span></div>
  <p id="fallback-note" role="status"></p>

  <script
    src="https://cdn.jsdelivr.net/npm/asciinema-player@3.8.0/dist/bundle/asciinema-player.min.js"
    crossorigin="anonymous"
  ></script>
  <script>
    (function () {
      "use strict";

      var stage = document.getElementById("stage");
      var note = document.getElementById("fallback-note");

      function showNote(msg) {
        note.textContent = msg;
        note.classList.add("show");
      }

      // Shared player configuration. The recording is a fixed 110x30 virtual
      // terminal at ~30fps, 24-bit truecolor.
      var OPTIONS = {
        // --- click-to-start: a still poster frame + play button, no autoplay
        autoPlay: false,
        poster: "npt:0:01", // show the frame at 0:01 as the click target
        loop: false,
        preload: true,      // fetch the cast up front so the first click is instant

        // --- look ---
        theme: "kimbie",    // our custom Kimbie Dark terminal theme (CSS above)
        fit: "width",       // fill the viewport WIDTH so the lyric is never clipped; <body> centers the band
        terminalLineHeight: 1.2, // a touch tighter than default for density
        terminalFontFamily:
          "'DejaVu Sans Mono', 'Iris Math Fallback', ui-monospace, " +
          "'SFMono-Regular', Menlo, Consolas, monospace",

        // --- NO video chrome: controls hidden; we drive start/replay ourselves ---
        controls: false,
      };

      // Mount the player and wire our OWN quiet click-to-start / replay, so
      // there is zero video-player chrome.
      function mount(src) {
        var player;
        try {
          player = window.AsciinemaPlayer.create(src, stage, OPTIONS);
        } catch (err) {
          console.error("[iris] asciinema-player failed to initialize:", err);
          showNote("Could not start the player — see console.");
          return;
        }

        var overlay = document.getElementById("start-overlay");
        var cue = overlay.querySelector(".cue");
        var ended = false;

        function begin() {
          overlay.classList.add("gone");
          if (ended) {
            ended = false;
            Promise.resolve(player.seek(0)).then(function () { player.play(); });
          } else {
            player.play();
          }
        }
        overlay.addEventListener("click", begin);

        if (player && typeof player.addEventListener === "function") {
          player.addEventListener("ended", function () {
            ended = true;
            cue.textContent = "replay";
            overlay.classList.remove("gone");
          });
        }
      }

      // Prefer the real animation (iris.cast); fall back to demo.cast if it
      // 404s (e.g. it hasn't been recorded yet), so the page always works.
      // ?v=N busts the browser cache when the recording changes (the .cast is
      // served immutable for speed). Bump N whenever you re-record.
      var PRIMARY = "iris.cast?v=3";
      var FALLBACK = "demo.cast?v=2";

      function boot() {
        if (!window.AsciinemaPlayer || typeof window.AsciinemaPlayer.create !== "function") {
          showNote("asciinema-player did not load from the CDN.");
          return;
        }
        // HEAD-probe the primary cast. A successful, non-404 response -> use it;
        // anything else -> fall back. Network failure also falls back.
        fetch(PRIMARY, { method: "HEAD" })
          .then(function (resp) {
            if (resp.ok) {
              mount(PRIMARY);
            } else {
              console.warn(
                "[iris] " + PRIMARY + " -> HTTP " + resp.status +
                "; falling back to " + FALLBACK + "."
              );
              mount(FALLBACK);
            }
          })
          .catch(function (err) {
            console.warn(
              "[iris] could not reach " + PRIMARY +
              " (" + err + "); falling back to " + FALLBACK + "."
            );
            mount(FALLBACK);
          });
      }

      // Render IDENTICALLY to the real terminal: asciinema-player measures the
      // cell width once, at create() time. If that runs before DejaVu Sans Mono
      // has loaded, it measures a fallback font and sizes the 110-col grid wrong
      // (a first-load font-swap can then mis-fit and clip the right edge). A real
      // terminal never has this race (its font is always present), so we wait for
      // the glyph fonts to load BEFORE mounting — making the web grid match.
      if (document.fonts && typeof document.fonts.load === "function") {
        Promise.all([
          document.fonts.load("400 15px 'DejaVu Sans Mono'"),
          document.fonts.load("700 15px 'DejaVu Sans Mono'"),
          document.fonts.load("400 15px 'Iris Math Fallback'")
        ]).then(function () { return document.fonts.ready; }).then(boot, boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
